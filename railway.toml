[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "npx prisma migrate deploy && node -e \"try { require('./dist/main') } catch(e) { console.error('STARTUP ERROR:', e.message, e.stack); process.exit(1) }\" 2>&1 || true"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
