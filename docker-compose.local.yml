services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licita_ia}
      POSTGRES_USER: ${POSTGRES_USER:-licita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licita-local-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - licita-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - licita-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-licita}:${POSTGRES_PASSWORD:-licita-local-change-me}@postgres:5432/${POSTGRES_DB:-licita_ia}?schema=public
      REDIS_URL: redis://redis:6379/0
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:19006}
      PUBLIC_SOURCES_SYNC_ENABLED: ${PUBLIC_SOURCES_SYNC_ENABLED:-false}
      PNCP_CONSULTA_BASE_URL: https://pncp.gov.br/api/consulta
      PNCP_PAGE_SIZE: ${PNCP_PAGE_SIZE:-50}
      PNCP_LOOKBACK_DAYS: ${PNCP_LOOKBACK_DAYS:-2}
      COMPRAS_PUBLICAS_BASE_URL: https://dadosabertos.compras.gov.br
      COMPRAS_PUBLICAS_PAGE_SIZE: ${COMPRAS_PUBLICAS_PAGE_SIZE:-100}
      COMPRAS_PUBLICAS_LOOKBACK_DAYS: ${COMPRAS_PUBLICAS_LOOKBACK_DAYS:-2}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
      SYNC_WINDOW_OVERLAP_HOURS: ${SYNC_WINDOW_OVERLAP_HOURS:-6}
      SYNC_LOCK_TTL_SECONDS: ${SYNC_LOCK_TTL_SECONDS:-3600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@licitaia.com.br}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  licita-postgres-data:
  licita-redis-data:
