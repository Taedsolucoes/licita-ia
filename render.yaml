services:
  - type: web
    name: licita-ia-api
    # Docker runtime is REQUIRED: the Dockerfile installs chromium for Puppeteer.
    # With "env: node" Render ignores dockerfilePath and builds natively,
    # leaving no chromium binary and breaking PDF generation in production.
    runtime: docker
    plan: standard
    # Overrides the Dockerfile CMD: run migrations before booting the API.
    # Executed from WORKDIR /app/apps/api (set in the Dockerfile).
    dockerCommand: sh -c "pnpm db:migrate && node --unhandled-rejections=throw dist/main.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      # No "scope: build": these must be available at RUNTIME as well.
      - key: DATABASE_URL
        sync: false
      # Use a connection string do Redis gerenciado; rediss:// ativa TLS automaticamente.
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"
      # SECURITY: must be an explicit domain in production (comma-separated list allowed).
      # main.ts logs a SECURITY WARNING if unset or "*" when NODE_ENV=production.
      - key: CORS_ORIGIN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # SMTP for password reset e-mails (MailService). Mock mode when SMTP_HOST unset.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Base web URL used in the password reset link
      - key: APP_WEB_URL
        sync: false
      # Ingestão exclusivamente por fontes governamentais oficiais.
      - key: PUBLIC_SOURCES_SYNC_ENABLED
        value: "false"
      - key: PNCP_CONSULTA_BASE_URL
        value: https://pncp.gov.br/api/consulta
      - key: PNCP_PAGE_SIZE
        value: "50"
      - key: PNCP_LOOKBACK_DAYS
        value: "2"
      - key: COMPRAS_PUBLICAS_BASE_URL
        value: https://dadosabertos.compras.gov.br
      - key: COMPRAS_PUBLICAS_PAGE_SIZE
        value: "100"
      - key: COMPRAS_PUBLICAS_LOOKBACK_DAYS
        value: "2"
      - key: SYNC_INTERVAL_MS
        value: "300000"
      - key: SYNC_WINDOW_OVERLAP_HOURS
        value: "6"
      - key: SYNC_LOCK_TTL_SECONDS
        value: "3600"
    dockerfilePath: apps/api/Dockerfile
    region: ohio
    numInstances: 1
    # Persistent disk for generated PDF reports.
    # - name (not "id") and mountPath are REQUIRED by the Blueprint spec;
    #   without mountPath the disk is never mounted and PDFs are lost on
    #   every deploy/restart (Render's filesystem is ephemeral).
    # - mountPath matches ReportsService: path.join(process.cwd(), 'storage', 'reports')
    #   with WORKDIR /app/apps/api from the Dockerfile => /app/apps/api/storage.
    disk:
      name: licita-ia-disk
      mountPath: /app/apps/api/storage
      sizeGB: 1
