services:
  - type: web
    name: licita-ia-api
    env: node
    plan: standard
    buildCommand: "pnpm install --frozen-lockfile && pnpm build"
    startCommand: "pnpm db:migrate && node apps/api/dist/main.js"
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckUnhealthyThreshold: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: DATABASE_URL
        scope: build
        sync: false
      - key: REDIS_URL
        scope: build
        sync: false
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium-browser"
      - key: CORS_ORIGIN
        value: "*"
      - key: ALERTALICITACAO_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
    dockerfilePath: apps/api/Dockerfile
    region: ohio
    numInstances: 1
    disk:
      id: licita-ia-disk
      sizeGB: 1
